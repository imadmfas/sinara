ub,small{color:var(--muted)}.ages,.topics,.choices,.kidchoices,.tools{display:grid;gap:10px}.ages{grid-template-columns:repeat(3,1fr)}.topics{grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,select,input,textarea{border:1px solid var(--line);border-radius:12px;background:white;padding:10px 14px}button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #167bcb;outline-offset:3px}button:hover{border-color:var(--jade)}button[aria-pressed="true"]{background:#e5f2e7;border:2px solid var(--jade);padding:9px 13px}.ages button,.topics button{text-align:start;display:flex;align-items:center;gap:12px}.ages b,.ages small{display:block}.symbol{font-size:1.45rem}.muteline{color:var(--muted);margin-bottom:18px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.row select{min-width:min(100%,230px)}label{font-weight:bold;display:block;margin:10px 0 4px}input,select,textarea{max-width:100%;min-height:46px}textarea{width:100%;resize:vertical}summary{cursor:pointer;font-weight:700;padding:12px 0}details+details{border-top:1px solid var(--line)}.tools{grid-template-columns:repeat(2,1fr)}.note,.result,.example{border-radius:14px;padding:16px;margin:12px 0;background:#eff5ee}.example.weak{background:#f9eee5}.result{border-inline-start:4px solid var(--jade);white-space:pre-line}.result:empty{display:none}.choices button{text-align:start}.action{background:var(--jade);color:white;font-weight:bold}.kidchoices{grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}.kidchoices button{text-align:center}.kidchoices .symbol{display:block;font-size:2.15rem}.nav{display:flex;flex-wrap:wrap;gap:12px;margin:15px 0}.nav a{background:#edf3e9;padding:6px 14px;border-radius:30px;text-decoration:none}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}.formgrid select,.formgrid input{width:100%} <script>
'use strict';
const ages=[['🧸','٤–٦ سنوات','ألعب مع كبير'],['🎒','٧–٩ سنوات','أستكشف وأتعلّم'],['🔎','١٠–١٢ سنة','أشرح وأجرّب'],['💡','١٣–١٧ سنة','أدرس وأنجز مشروعاً'],['📚','١٨–٢٢ سنة','أدرس أو أتعلّم مهنة'],['🌿','٢٣ سنة فأكثر','أستخدمه في عملي وحياتي']];
const fields=[
['🏗️','الهندسة والعمارة','العمارة|الهندسة المدنية|الهندسة الكهربائية|الهندسة الميكانيكية','ارسم لي خريطة بيت','أرض افتراضية أبعادها ١٠ × ٢٠ متراً وشارعها شمالاً. اقترح توزيعاً أولياً لبيت بطابق واحد فيه ثلاث غرف نوم وفناء. اذكر المساحات التقريبية في جدول، ثم اسألني عن معلومة قد تغيّر التوزيع. سأعرض التصوّر على مهندس قبل التنفيذ.','اتجاه المدخل وعدد الغرف يغيّران التوزيع. ذكر المساحة والشكل المطلوب يجعل المقترح قابلاً للمناقشة.'],
['🩺','الصحة والتثقيف الصحي','التثقيف الصحي|التمريض|الصيدلة|التواصل مع المراجع','اكتب عن الصحة','أعدّ مسودة نشرة توعوية لزوّار مركز صحي تشرح كيف يستعدّون للموعد ويكتبون أسئلتهم. استخدم العربية المبسطة وخمس نقاط قابلة للطباعة.','تحديد الجمهور ومكان الاستخدام يضبط اللغة وطول النشرة.'],
['📖','التعليم والتدريب','التعليم الابتدائي|التعليم الثانوي|التدريس الجامعي|التدريب المهني','حضّر لي درساً','أدرّس الصف الرابع الابتدائي. صمّم نشاطاً من عشر دقائق لتمييز الفعل الماضي من المضارع، باستخدام بطاقات ورقية، ومعه سؤال أتحقق به من الفهم.','تحدد المرحلة والمهارة والوسيلة والزمن ما يمكن تنفيذه في الصف.'],
['🔬','البحث العلمي','تصميم الدراسات|تحليل البيانات|الكتابة الأكاديمية|مراجعة المصادر','اكتب بحثاً بالمراجع','سأزوّدك بملخصات ثلاث دراسات. قارن أسئلتها وعيناتها في جدول، واربط كل ملاحظة بالملخص الذي أخذتها منه، وعلّم البيانات الناقصة. انتظر الملخصات قبل البدء.','تتيح الإحالة إلى النص المعطى تتبّع الاستنتاج ومراجعته.'],
['💻','الحاسوب والتقنية','البرمجة|الجداول الإلكترونية|تصميم المواقع|الثقافة الرقمية','علّمني الحاسوب','أتعلّم البرمجة ببايثون. اشرح كيف أحسب مجموع مشتريات من قائمة أسعار بالدينار العراقي. ابدأ بثلاثة أسعار افتراضية، وتتبّع تغيّر المجموع بعد كل خطوة، ثم أعطني تمريناً مشابهاً.','تحديد بنية البيانات يساعد على اختبار الطريقة على مثال صغير.'],
['🧾','الإدارة والأعمال','إدارة المشاريع|المحاسبة|التسويق|المتاجر الصغيرة','رتّب مشروعي','أخطط لمعرض كتب مدرسي بعد أربعة أسابيع بفريق من ثلاثة أشخاص. ضع جدولاً بالمهام والمسؤول عن كل مهمة وموعدها، وبيّن ما يجب إنجازه قبل الإعلان عن المعرض.','عدد أفراد الفريق والموعد النهائي يساعدان على توزيع مهام يمكن تنفيذها.'],

['🌴','الزراعة والبيئة','زراعة النخيل|الري|الحديقة المنزلية|التربية البيئية','ساعدني بالمزرعة','صمّم سجلّ متابعة أسبوعياً لبستان نخيل صغير، فيه تاريخ الري ووقت التشغيل والملاحظات. أعطني نموذجاً فارغاً وصفاً واحداً معبّأً ببيانات افتراضية.','المطلوب سجلّ قابل للاستعمال، والمثال يوضّح طريقة تعبئته.'],
['🎨','الفنون والإعلام','الرسم|التصميم|التصوير|كتابة المحتوى','صمّم صورة حلوة','اقترح وصفاً لملصق عمودي لمعرض رسم مدرسي في الفلوجة. اجعل الألوان دافئة واترك مساحة واضحة لعنوان عربي وموعد المعرض. أعطني وصفين أختار بينهما.','ذكر المقاس والغرض ومساحة العنوان يساعد المصمم على استخدام الصورة.'],
['🗣️','اللغات والترجمة','المحادثة الإنجليزية|اللغة العربية|الترجمة|القراءة','علّمني الإنكليزي','درّبني على شراء كتاب بالإنجليزية بمستوى مبتدئ. ابدأ بسؤال واحد بصفة البائع، وانتظر جوابي، ثم صحّح خطأً واحداً واشرحه بالعربية.','تبادل الأدوار وانتظار الجواب يتيحان تدريباً فعلياً على المحادثة.'],
['🏠','الحياة اليومية والحِرف','تنظيم الوقت|الحِرف اليدوية|التسوّق|المهارات الرقمية','رتّب أموري','عندي ساعتان بعد الدوام لشراء الحاجات وترتيب الغرفة والقراءة. اقترح جدولاً فيه وقت بداية كل مهمة ومدتها، واترك ربع ساعة احتياطاً.','تحوّل المدة المتاحة وقائمة المهام الطلب العام إلى جدول يمكن تعديله.'],
['🏛️','العلوم الإنسانية والدراسات الإسلامية','العقيدة والأديان|التاريخ|الفلسفة|علم الاجتماع','اشرح أقوال العلماء','سأضع نصّين في المسألة نفسها. لخّص حجة كل مؤلف، وميّز عبارته المنقولة من شرحك، واربط كل اقتباس بموضعه في النص المرفق. انتظر النصين.','الفصل بين الاقتباس والتفسير يحافظ على نسبة الكلام إلى صاحبه.']
];
const worlds=[
['🐦','القصص والحيوانات',['عصفور','قطة','سلحفاة'],['🐦','🐈','🐢'],'احكِ لي عن','قصة من ثلاث جمل','ماذا يحدث بعد ذلك؟'],
['🎨','الألوان والرسم',['نخلة','زهرة','فراشة'],['🌴','🌷','🦋'],'ساعدني على رسم','ثلاث خطوات سهلة','بأي لون أبدأ؟'],
['🔢','العدّ والألعاب',['تفاحات','كرات','أقلام'],['🍎','⚽','✏️'],'ساعدني على عدّ','لعبة فيها ثلاثة أشياء','كم يبقى إذا أخذنا واحداً؟'],
['🏡','البيت والأشكال',['بيت','نافذة','باب'],['🏡','🪟','🚪'],'ساعدني على صنع شكل','باستعمال مربعات ومثلثات من الورق','ما الشكل الذي أختاره أولاً؟']
];
const school=[
['🌌','العلوم والطبيعة','الفضاء|النباتات|الماء'],['✏️','القراءة واللغات','قصة قصيرة|مفردات إنجليزية|وصف صورة'],['🧮','الرياضيات','الجمع|الكسور|الأشكال'],['🎨','الفن والابتكار','الرسم|مجسّم ورقي|ملصق'],['🌴','العراق وبيئته','النخلة|دجلة والفرات|الأهوار'],['💡','المشاريع والتقنية','جدول بيانات|عرض مدرسي|فكرة برنامج']

const services=[['شرح مفهوم','شرحاً مبسّطاً مع مثال وسؤال يختبر فهمي'],['مقارنة خيارات','مقارنة تذكر معايير الاختيار ومزايا كل خيار وحدوده'],['خطة عمل','خطة مرتبة بحسب الأولوية وتذكر ما أحتاجه لكل خطوة'],['تصميم بصري','وصفاً بصرياً يحدد العناصر وترتيبها وما ينبغي أن يظهر في الصورة'],['إعداد اختبار','أسئلة متدرجة وأجوبة نموذجية منفصلة وتعليلاً لكل جواب'],['تلخيص نص','ملخصاً يستند حصراً إلى النص الذي سأقدمه. انتظر النص قبل التلخيص'],['صياغة رسالة','مسودة رسالة تناسب الجهة المذكورة وتنتهي بطلب واضح'],['مراجعة مسودة','ملاحظات على مسودتي تبين موضع كل تعديل وسببه. انتظر المسودة'],['عصف ذهني','ثلاث أفكار مختلفة، مع خطوة أولى لتجربة كل واحدة'],['تمرين محادثة','حواراً تفاعلياً يبدأ بسؤال واحد وينتظر إجابتي']];
const $=id=>document.getElementById(id);let age=-1,field=-1,branch='',draft='',second=false,scenario=null;const el=(tag,txt)=>Object.assign(document.createElement(tag),{textContent:txt});function btn(host,txt,cb,cls=''){const b=el('button',txt);b.type='button';b.className=cls;b.onclick=cb;host.append(b);return b}function line(host,tag,txt,cl=''){const n=el(tag,txt);n.className=cl;host.append(n);return n}function jump(n){n.focus({preventScroll:true});n.scrollIntoView({block:'start'})}function pressed(host,i){Array.from(host.children).forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)))}function options(s,items){s.replaceChildren(...items.map((t,i)=>new Option(t,i)))}function scope(){return age===0?worlds:age<=2?school:fields}

function pickAge(i){age=i;field=-1;pressed($('ages'),i);$('lesson').hidden=true;$('path').hidden=false;$('branchBox').hidden=true;$('areaTitle').textContent=age===0?'بماذا نلعب اليوم؟':age<=2?'ماذا تحب أن تستكشف؟':age===3?'أيّ مجال تريد أن تجرّبه؟':'في أيّ مجال تريد استخدام الذكاء الاصطناعي؟';$('areaLead').textContent=age===0?'للكبير المرافق: اقرأ الخيارات ودع الطفل يشير إلى ما يحب.':age<=2?'اختر اهتماماً ثم موضوعاً لنجرّب سؤالاً معاً.':age===3?'اختر مجالاً لتكتشفه من خلال مشروع مدرسي.':'اختر مجالاً ثم تخصصاً فرعياً لتبني طلباً يناسب مهمتك.';$('topics').replaceChildren();scope().slice(0,age===1?5:undefined).forEach((f,j)=>{const b=btn($('topics'),'',()=>pickField(j));line(b,'span',f[0],'symbol');line(b,'b',f[1])});pressed($('topics'),-1);gloss();jump($('path'))}
function pickField(i){field=i;pressed($('topics'),i);$('lesson').hidden=true;const f=scope()[i];if(age===0){branch=f[2][0];showLesson();return}$('branchBox').hidden=false;$('branchLabel').textContent=age<=2?'اختر موضوعاً':'اختر التخصص الفرعي';options($('branch'),f[2].split('|'));$('branch').focus()}

const branchTasks=[
['','رتّب سجل ملاحظات زيارة موقع افتراضي في جدول يفرّق بين ما شاهده الفريق وما يحتاج إلى فحص مهني. أعطني صفاً نموذجياً.','أقارن استهلاك مصباحين بقدرتين مختلفتين يعملان المدة نفسها. أعطني مثالاً رقمياً افتراضياً، وبيّن الوحدات وطريقة مراجعة الحساب.','اشرح انتقال الحركة بين ترسين بمثال لدراجة هوائية. اختم بسؤال أتنبأ فيه بما يحدث عند تغيير حجم أحد الترسين.'],
['','اقترح حواراً تمثيلياً قصيراً بين ممرّض ومراجع للتحقق من فهم تعليمات مكتوبة سأرفقها. التزم بالنص وانتظره.','صمّم تمريناً لطلبة الصيدلة يفرّق بين الاسم التجاري والعلمي، باستخدام عبوات افتراضية، وضع مفتاحاً للتصحيح.','صغ ثلاث طرق مهذّبة يطلب بها موظف الاستقبال من المراجع إعادة شرح حاجته. وضّح متى تناسب كل عبارة.'],
['','أدرّس الفيزياء للرابع العلمي. اقترح تجربة صفّية توضّح الفرق بين المسافة والإزاحة باستخدام شريط قياس، ثم سؤالاً أطلب فيه تفسير النتيجة.','أدرّس الإنكليزية للمرحلة الثانية في كلية عراقية. صمّم نشاطاً ثنائياً من عشر دقائق يميّز الماضي البسيط من المستمر، وأرفق معياراً سريعاً لتصحيح الجواب.','صمّم بطاقة ملاحظة لمدرّب خياطة يقوّم دقّة القياس في تمرين قماش، مع ثلاثة معايير يمكن مشاهدتها.'],
['','سأقدّم جدولاً افتراضياً لدرجات شعبتين. افحص اكتمال الأعمدة ثم اقترح وصفاً إحصائياً يناسب السؤال. انتظر البيانات وميّز الوصف من التفسير.','راجع فقرة أكاديمية سأرفقها وحدّد الجمل التي تحتاج إلى دليل. أعطني سبب كل ملاحظة مع الحفاظ على معنى الكاتب. انتظر الفقرة.','سأرفق بطاقتي مصدرين. قارن بيانات المؤلف والعنوان والطبعة والصفحات، وضع علامة عند كل بيان يحتاج إلى مراجعة الأصل. انتظر البطاقتين.'],
['','أعطني مثال جدول للمشتريات بالدينار العراقي من أربعة صفوف، مع معادلة جمع وإجابة أتأكد منها يدوياً.','صمّم ترتيب عناصر صفحة عربية لمعرض مدرسي يزوره الأهالي بالهاتف. اذكر وظيفة كل عنصر واقترح نص زر التسجيل.','اشرح لمبتدئ طريقة تنظيم صور الهاتف في ألبومات بأسماء عربية. أعطه مهمة صغيرة يمارسها على صور تجريبية.'],
['','أنشئ مثالاً تعليمياً لسجلّ إيراد ومصروف لمحل قرطاسية، بخمس حركات افتراضية بالدينار العراقي ورصيد يمكن التحقق منه يدوياً.','اقترح نسختين من إعلان عن خدمة تغليف الكتب، واحدة للطلبة وأخرى لأولياء الأمور. اشرح سبب اختلاف العبارة الافتتاحية.','ساعدني على ترتيب عرض دفاتر مدرسية في متجر صغير. اقترح ثلاث طرق لتصنيفها وسؤالاً أطرحه على الزبون لتقييم الترتيب.'],
['','صغ مسودة مخاطبة رسمية من قسم جامعي عراقي إلى مكتبة الكلية لحجز قاعة لورشة، مع خانات فارغة للتاريخ والعدد والتوقيع.','سأرفق تعليمات معاملة إدارية. حوّل الخطوات المذكورة إلى قائمة تتضمن المسؤول والمستند المطلوب ورقم الفقرة، وانتظر الوثيقة.'],
['','أنشئ جدول متابعة لساعات تشغيل مضخة مزرعة افتراضية على مدى أسبوع، مع خانة للملاحظات ومثال لطريقة جمع الساعات.','اقترح سجل ملاحظة لنمو نبتة في أصيص منزلي. اجعله مناسباً لمبتدئ وأضف مثالاً لقياس واحد.','صمّم نشاطاً مدرسياً لفرز مخلفات ورقية وبلاستيكية باستخدام مواد نظيفة. اختم بسؤال يقيس ما تعلمه الطلاب.'],
['','ضع تصوراً لملصق معرض مدرسي عمودي، وحدد مكان العنوان والصورة والموعد، واقترح بديلين للألوان.','أريد تصوير نخلة بالهاتف. اقترح ثلاث لقطات من زوايا مختلفة، واشرح ما سيلاحظه المشاهد في كل لقطة.','اكتب مسودتين لمنشور عراقي قصير يعرّف بمكتبة مدرسية، إحداهما بالفصحى والأخرى بلهجة عراقية مفهومة.'],
['','درّبني على تمييز المبتدأ والخبر في ثلاث جمل عن المدرسة. اعرض الأولى وانتظر إجابتي قبل التصحيح.','سأرفق إعلاناً جامعياً قصيراً بالعربية. ترجمه إلى إنكليزية رسمية وحافظ على التواريخ وميّز أي عبارة تحتمل معنيين. انتظر الإعلان.','اختر فقرة قصيرة من إنشائك عن نهر الفرات، ثم اطرح سؤالاً عن الفكرة الرئيسة وانتظر إجابتي.'],
['','اقترح بطاقة تهنئة من ورق مطوي يمكن صنعها في عشر دقائق. اذكر المواد المتاحة في البيت ورتّب الخطوات.','سأعطيك لائحة مشتريات وأسعاراً افتراضية بالدينار العراقي. رتّبها ضمن ميزانيتي واذكر أي سعر ينقصك قبل الحساب.','اشرح لشخص يستعمل الهاتف لأول مرة كيف يبحث داخل قائمة الأسماء باستخدام اسم تجريبي، ثم اطلب منه إعادة الخطوات.'],
['','سأرفق وثيقتين عن حدث تاريخي واحد. قارن وصفهما للحدث وأشر إلى مواضع الاتفاق والاختلاف وانتظر الوثيقتين.','سأضع فقرة فلسفية قصيرة. استخرج الدعوى والمقدمات، ثم صغ اعتراضاً واحداً وميّزه عن كلام المؤلف. انتظر الفقرة.','أدرس عادة القراءة عند طلبة الجامعة. اقترح خمسة أسئلة مقابلة مفتوحة وتجنب الأسئلة التي توحي للمشارك بإجابة بعينها.']
];
function makeScenario(){let f=scope()[field];if(age<=2){let adv=age===2;return ['علّمني '+branch,'أتعلم عن «'+branch+'». '+(adv?'اقترح تحدّياً أستطيع إنجازه بالورقة والقلم. أعطني تلميحاً أولاً وانتظر محاولتي قبل عرض الحل.':'اشرح الفكرة بمثال من حياتي في البيت أو المدرسة، ثم اسألني سؤالاً واحداً وانتظر جوابي.'),adv?'طلب التلميح يترك لك فرصة المحاولة وشرح ما فهمت.':'المثال القريب والسؤال القصير يساعدانك على شرح ما فهمته.']}if(age===3)return ['اكتب مشروعي عن '+branch,'أنا طالب في الإعدادية أستكشف «'+branch+'». اقترح سؤالاً صغيراً لمشروع مدرسي يمكنني تنفيذه خلال أسبوع. أعطني خطوتين للبدء ومصدراً أبحث عنه بنفسي، ثم انتظر اختياري.','المدة والسؤال المحدد يجعلان المشروع قابلاً للتجربة، وتبقى لك مهمة البحث والاختيار.'];if(branch===f[2].split('|')[0])return f.slice(3,6);const bi=f[2].split('|').indexOf(branch);return ['أريد معلومات عن '+branch,branchTasks[field][bi],'تحدد الصياغة مهمة واقعية في '+branch+'، وتبيّن ما يمكن مراجعته بعد الحصول على الجواب.']}

function showLesson(){draft='';second=false;const l=$('lesson');l.replaceChildren();l.hidden=false;if(age===0){kid();jump(l);return}scenario=makeScenario();const f=scope()[field];const top=section(l,branch,'تدريب '+f[1]);const n=line(top,'nav','','nav');[['compare','قُل ولا تقل'],['test','اختبر نفسك'],['builder','مولّد الطلبات']].forEach(([id,txt])=>{const a=line(n,'a',txt);a.href='#'+id});const c=section(l,'قُل ولا تقل');c.id='compare';const weak=line(c,'div','','example weak');line(weak,'b','لا تقل');line(weak,'p',scenario[0]);const good=line(c,'div','','example');line(good,'b','قُل');line(good,'p',scenario[1]);line(c,'p',scenario[2]);const q=section(l,'اختبر نفسك');q.id='test';quiz(q);const b=section(l,'مولّد الطلبات');b.id='builder';build(b);jump(l)}

function quiz(q){q.replaceChildren();line(q,'h2','اختبر نفسك');const step=second;const opts=step?[['أراجع معلومة رئيسة بالرجوع إلى الكتاب أو المصدر، ثم أصحّح الطلب إذا وجدت فرقاً.','أحسنت. تستطيع الآن تحديد موضع الخطأ وطلب تصحيحه.',1],['أقبل الجواب لأنه مكتوب بلغة واثقة.','الثقة في الصياغة لا تثبت دقّة المعلومة. جرّب اختياراً آخر.',0],['أكرر السؤال وأعدّ تكرار الجواب دليلاً على صحته.','قد يتكرر الخطأ نفسه. ابحث عن دليل مستقل.',0]]:[[scenario[1],scenario[2],1],[scenario[0]+' بالتفصيل.','كلمة «بالتفصيل» لا تحدد ما تريد فعله بالنتيجة. جرّب اختياراً آخر.',0],['أعطني أفضل جواب في العالم عن '+branch+'.','وضّح المهمة أو الناتج الذي يمكن مراجعته. جرّب اختياراً آخر.',0]];line(q,'p',step?'وصل جواب فيه معلومة ستعتمد عليها. ما خطوتك التالية؟':'أي صياغة تخدم المهمة التي قرأتها؟');const choices=line(q,'div','','choices'),r=line(q,'div','','result');r.setAttribute('role','status');if(!step&&age>=4&&field===0&&branch==='العمارة'){opts[0][0]='اقترح توزيعاً أولياً لغرف بيت على قطعة ١٠ × ٢٠ متراً بواجهة شمالية. نحتاج ثلاث غرف وفناءً. اعرض مساحات تقريبية، وحدّد ما يلزم سؤالي عنه قبل تعديل التصور.';opts[1][0]='ارسم بيتاً بثلاث غرف وفناء. اختر أنت أبعاد الأرض واتجاهها، وسأتعامل مع الرسم على أنه يناسب أرضي.';opts[1][1]='عدد الغرف مفيد، لكن افتراض الأبعاد والاتجاه قد يجعل المقترح غير مناسب لأرضك.';opts[2][0]='مساحة الأرض ٢٠٠ متر مربع. صمّم واجهة جميلة واختر الألوان ونوع الأثاث.';opts[2][1]='حددت المساحة، لكن المهمة تتعلق بتوزيع الغرف. أبعاد القطعة واحتياجات الساكنين أهم هنا من ألوان الأثاث.'}const offset=(field+age+(step?1:0))%3;for(let j=0;j<3;j++){let o=opts[(j+offset)%3];btn(choices,o[0],()=>{r.textContent=o[1];pressed(choices,j);if(o[2]){for(const b of choices.children)b.disabled=true;btn(q,step?'أعد الاختبار':'انتقل إلى فحص الجواب',()=>{second=!step;quiz(q)},'action')}})}}
function kid(){const f=worlds[field],l=$('lesson');const s=section(l,f[1],'للكبير المرافق: اقرأ بصوتك، أو استخدم زر الاستماع إذا توفر صوت عربي في الجهاز.');line(s,'h3','اختر ما تحب');const picks=line(s,'div','','kidchoices'),session=line(s,'div','');function render(i){branch=f[2][i];pressed(picks,i);session.replaceChildren();const prompts=['احكِ لي قصة من ثلاث جمل عن '+branch+'، ثم اسألني ماذا سيحدث بعدها.','ساعدني على رسم '+branch+' بثلاث خطوات سهلة، ثم اسألني بأي لون أبدأ.','العب معي لعبة عدّ فيها ثلاث '+branch+'، ثم اسألني كم يبقى إذا أخذنا واحداً.','ساعدني على صنع شكل '+branch+' من قطع ورقية. اسألني أي قطعة أختار أولاً.'];const prompt=prompts[field].replace('ثلاث أقلام','ثلاثة أقلام');line(session,'p',prompt,'example');speakBtn(session,prompt);line(session,'h3','لنجرّب معاً');const target=f[2][i];const outcomes=[['خرجت '+({عصفور:'عائلة العصفور',قطة:'قطة صغيرة',سلحفاة:'سلحفاة صغيرة'}[target])+' صباحاً. وجدت ورقة خضراء عند الباب. حرّك الهواء الورقة فطارت قليلاً. ماذا يحدث بعدها؟',['تتبع الورقة','تعود إلى البيت'],['تخيّل أين استقرّت الورقة، وارسم المكان مع الكبير.','تخيّل ماذا تحكي حين تعود، وأكمل القصة بجملة منك.']],['تخيّل '+target+' على ورقتك. ارسم شكلها الكبير أولاً، وأضف جزءاً صغيراً، واختر الآن لوناً.',['أخضر','أصفر'],['لوّن جزءاً بالأخضر. أين رأيت هذا اللون اليوم؟','لوّن جزءاً بالأصفر. هل تجد شيئاً أصفر حولك؟']],['هذه ثلاث '+target+' '+f[3][i]+f[3][i]+f[3][i]+' . غطِّ واحدة بإصبعك. كم بقي؟',['اثنتان','ثلاث'],['أحسنت! بقيت اثنتان. أعد القطعة الثالثة وعدّ الأشياء من البداية.','عدّ الثلاث أولاً، ثم غطِّ واحدة وعدّ الظاهر فقط. جرّب مرة ثانية.']],['سنصنع '+target+' من قطع ورقية جاهزة. أي قطعة تختار أولاً؟',['مربّع','مثلّث'],['ضع المربع أمامك واختر أين تضع المثلث. صف ما صنعت للكبير.','ضع المثلث أمامك وجرّب أن تضيف مربعاً تحته. ماذا يشبه الشكل؟']]];let o=outcomes[field];if(field===2&&target==='أقلام'){o[0]='هذه ثلاثة أقلام ✏️ ✏️ ✏️. غطِّ قلماً بإصبعك. كم بقي؟';o[1]=['قلمان','ثلاثة'];o[2]=['أحسنت! بقي قلمان. أعد القلم الثالث وعدّ من البداية.','غطِّ قلماً واحداً وعدّ القلمين الظاهرين. جرّب مرة ثانية.']}line(session,'p',o[0]);speakBtn(session,o[0]+' '+o[1].join('، أو '));const actions=line(session,'div','','kidchoices'),answer=line(session,'div','','result');answer.setAttribute('role','status');o[1].forEach((v,j)=>btn(actions,v,()=>{answer.textContent=o[2][j];pressed(actions,j)}));line(session,'p','للمرافق: بعد النشاط اسأل الطفل «شنو غيّرنا بالسؤال؟» ثم اختارا شيئاً آخر وجربا الفرق.','note')}

function speakBtn(parent,txt){if(!('speechSynthesis'in window))return;const b=btn(parent,'استمع 🔊',()=>{const voices=speechSynthesis.getVoices();const v=voices.find(v=>/^ar/i.test(v.lang));if(!v){b.textContent='الصوت العربي غير متاح هنا؛ يقرأ المرافق النص.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang=v.lang;u.voice=v;u.rate=.85;speechSynthesis.speak(u)})}
function build(s){line(s,'p',age<=2?'ركّب سؤالك مع شخص كبير. استخدم أمثلة خيالية في التدريب.':'حدّد المهمة ومن سيقرأ الناتج. ستظهر مسودة يمكنك تعديلها ونسخها.');const grid=line(s,'div','','formgrid');function form(title,id,tag,values){const d=line(grid,'div','');let lab=line(d,'label',title);lab.htmlFor=id;let n=document.createElement(tag);n.id=id;d.append(n);if(tag==='select')options(n,values);else n.placeholder=values;return n}const svc=form('الخدمة','service','select',services.map(v=>v[0]));const aud=form('لمن تُعدّ هذا الطلب؟','aud','input','مثلاً: طلبة السنة الأولى');aud.value=age<=2?'تلميذ في المدرسة':age===3?'طلبة الإعدادية':age===4?'متعلّم يبدأ التخصص':'زملاء في العمل';const goalLabel=line(s,'label','ما الذي تريد إنجازه تحديداً؟');goalLabel.htmlFor='goal';let goal=line(s,'textarea','');goal.id='goal';goal.rows=2;goal.placeholder='اكتب المهمة بكلماتك';goal.value=({0:'مقارنة توزيعَين أوليَّين لبيت عراقي صغير',1:'إعداد مادة تثقيفية قصيرة للزوّار',2:'إعداد نشاط تعليمي قصير',3:'مقارنة مواد دراسية معطاة'})[age>=4&&branch===scope()[field][2].split('|')[0]?field:-1]||('التدرّب على '+branch+' بمثال عملي');let grid2=line(s,'div','','formgrid');let outLabel=line(grid2,'label','شكل الناتج');let shape=line(outLabel,'select','');options(shape,['نقاط قصيرة','جدول','خطوات مرقّمة','حوار','فقرة قصيرة']);let limitLabel=line(grid2,'label','قيد أو شرط إضافي');let limit=line(limitLabel,'input','');limit.placeholder='مثلاً: خمسة أسطر أو عشر دقائق';if(age>=4&&field===0&&branch==='العمارة')svc.value='1';btn(s,'ولّد الطلب',()=>{if(!goal.value.trim()){goal.setCustomValidity('اكتب مهمتك أولاً.');goal.reportValidity();return}const txt='المجال: '+scope()[field][1]+'، والتخصص: '+branch+'.\nأريد '+services[Number(svc.value)][1]+'.\nمهمتي: '+goal.value.trim()+'.\nالجمهور: '+(aud.value.trim()||'متعلّم مهتم بهذا الموضوع')+'.\nقدّم الناتج في صورة '+shape.selectedOptions[0].textContent+'.'+(limit.value.trim()?'\nالتزم بهذا الشرط: '+limit.value.trim()+'.':'')+'\n'+(age<=2?'استخدم كلمات سهلة واسألني سؤالاً واحداً بعد الشرح.':'إذا نقصت معلومة تؤثر في الجواب فاسألني عنها أولاً، وميّز الافتراضات من المعلومات التي أعطيتُك إياها.');res.hidden=false;output.value=txt;status.textContent='الطلب جاهز للتعديل والنسخ.'},'action');const res=line(s,'div','');res.hidden=true;const lbl=line(res,'label','مسودة طلبك القابلة للتعديل');lbl.htmlFor='output';const output=line(res,'textarea','');output.id='output';output.rows=7;btn(res,'نسخ الطلب',async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent='تم نسخ الطلب.'}catch{output.focus();output.select();status.textContent='تم تحديد الطلب. استخدم أمر النسخ في جهازك.'}});const status=line(s,'p','','sub');status.setAttribute('role','status');[svc,aud,goal,shape,limit].forEach(n=>n.addEventListener('input',()=>{goal.setCustomValidity('');res.hidden=true;status.textContent=''}));}
function gloss(){const kidMode=age===0,young=age>=1&&age<=2;const items=[['💡 ما الذكاء الاصطناعي؟',kidMode?'قل للطفل: علّم الناس الحاسوب من أمثلة كثيرة. يستطيع أن يقترح قصة، ونستطيع أن نغيّرها معاً.':young?'تتعلّم بعض البرامج من أمثلة كثيرة. حين تكتب لها بداية قصة تقترح تكملة، ويمكنك تغييرها.':'تتعلّم أنظمة الذكاء الاصطناعي أنماطاً من البيانات لتؤدي مهام مثل التعرف على الكلام واقتراح النصوص. وقد تنتج جواباً مقنعاً فيه خطأ.'],['🌱 كيف يفيدني؟',kidMode?'اختارا حيواناً، واطلبا قصة قصيرة، ثم دَع الطفل يخترع النهاية بصوته.':young?'اطلب تلميحاً في مسألة، جرّب الحل بنفسك، ثم قارن طريقتك بالمثال.':'استعمله للحصول على مسودة أو مقارنة أو تمرين يناسب مستواك. حدّد أولاً ماذا ستفعل بالنتيجة.'],['🧩 ما أنواعه؟',kidMode?'برنامج يتعرّف إلى صوت، وآخر يصنع رسمة. جرّبا تقليد صوت عصفور ثم ارسموه على الورق.':'من وظائفه التعرّف مثل تحويل الكلام إلى نص، والتنبؤ مثل تقدير الطلب، والتوليد مثل كتابة قصة أو إنشاء صورة. وقد يجمع التطبيق أكثر من وظيفة.'],['🛠️ أين يُستعمل؟',kidMode?'في لعبة تعرف الأشكال، أو أداة تقترح قصة يقرؤها الكبير.':'في الهاتف لتحويل الكلام إلى كتابة، وفي الدراسة لصناعة تمارين، وفي العمل لتنظيم مسودة أو مقارنة خيارات.'],['🔎 هل أصدّق كل جواب؟',kidMode?'إذا سمعت شيئاً غريباً، اسأل الكبير معك: كيف نتأكد؟':young?'قارن الجواب بكتابك أو جرّب المثال بنفسك مع المعلم. استخدم أسماء خيالية في التمارين.':'اختبر المثال وراجع المصدر الأصلي قبل اعتماد المعلومة. ارجع إلى المختص في القرارات المهنية.']];$('gloss').replaceChildren();items.forEach(([t,p])=>{let d=line($('gloss'),'details','');line(d,'summary',t);line(d,'p',p)})}gloss();
</script></body></html>
